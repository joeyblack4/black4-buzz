name: ci
on:
  pull_request:
  push:
    branches: [main, stable]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run setup
      - run: npm run check
      - run: npm run test:subscriptions
  windows:
    runs-on: windows-latest
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run setup
      - run: node --check plugins/black4/plugin.js
      - run: node --check bridge/black4-agent-mcp/black4-agent-mcp.mjs
      - run: node scripts/check-build-folder.mjs
      - run: node kit/build.mjs --check
      - run: node src/build.mjs --check
      - run: node subscriptions/build.mjs --check
      - run: npm test
      - run: npm run test:subscriptions
